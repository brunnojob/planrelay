name: PlanRelay
on:
  push:
    branches: [main]
    paths: ['tools/planrelay/**', 'docs/planrelay-demo/**', '.github/workflows/planrelay.yml']
  pull_request:
    paths: ['tools/planrelay/**', 'docs/planrelay-demo/**', '.github/workflows/planrelay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planrelay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tools/planrelay/test/review.test.mjs
      - run: node tools/planrelay/build-demo.mjs
      - run: git diff --exit-code -- docs/planrelay-demo
