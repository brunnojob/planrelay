<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc"><title id="title">PlanRelay — Review the plan. Keep the context.</title><desc id="desc">An open source review workspace built on Plannotator, with revision-bound decisions.</desc><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#24313c" stroke-width=".5"/></pattern><linearGradient id="glow"><stop stop-color="#58ddb0"/><stop offset="1" stop-color="#192d2c"/></linearGradient></defs><rect width="1280" height="460" rx="18" fill="#0c1117"/><rect width="1280" height="460" rx="18" fill="url(#grid)"/><rect x="62" y="63" width="49" height="49" rx="13" fill="#58ddb0"/><path d="M77 100V76h12a8 8 0 0 1 0 16H77m11 0 11 8" fill="none" stroke="#0c2119" stroke-width="4"/><text x="125" y="99" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#e5edf4">planrelay<tspan fill="#58ddb0">.</tspan></text><text x="62" y="187" font-family="Arial,sans-serif" font-size="49" font-weight="600" fill="#e5edf4">Review the plan.</text><text x="62" y="246" font-family="Arial,sans-serif" font-size="49" font-weight="600" fill="#58ddb0">Keep the context.</text><text x="65" y="294" font-family="Arial,sans-serif" font-size="18" fill="#8493a3">A human checkpoint for developer and agent workflows.</text><text x="65" y="381" font-family="monospace" font-size="13" fill="#8493a3">LOCAL FIRST   /   REVISION AWARE   /   OPEN SOURCE</text><rect x="765" y="95" width="446" height="276" rx="13" fill="#10171f" stroke="#2c3a45"/><circle cx="789" cy="117" r="4" fill="#58ddb0"/><text x="805" y="122" font-family="monospace" font-size="11" fill="#8493a3">REVIEW WORKSPACE</text><path d="M765 139H1211" stroke="#24303c"/><text x="792" y="175" font-family="monospace" font-size="13" fill="#e5edf4"># Authentication rollout</text><rect x="792" y="194" width="286" height="6" rx="3" fill="#2b3946"/><rect x="792" y="2